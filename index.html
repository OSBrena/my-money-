<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>My Money</title>
</head>
<body><div id="app">
<header class="topbar"><div><div class="eyebrow">MY MONEY</div><h1 id="pageTitle">Carteira Digital</h1></div><div class="header-right"><div class="flag">🇺🇸</div><button class="icon-btn" id="hideBtn" aria-label="Ocultar saldo">◉</button></div></header>
<main id="main"><nav class="wallet-tabs" id="walletTabs"><button data-wallet="digital" class="wallet-tab active">Carteira digital</button><button data-wallet="physical" class="wallet-tab">Carteira física</button></nav><section class="balance-card"><div class="label">Saldo disponível</div><div class="balance" id="balance">$ 0,00</div></section><section id="content"></section></main>
<nav class="bottom"><button class="bottom-btn active" data-nav="wallet">⌂<span>Início</span></button><button class="bottom-btn" data-nav="statement">▤<span>Extrato</span></button><button class="plus" id="plusBtn" aria-label="Adicionar">+</button><button class="bottom-btn" data-nav="summary">◔<span>Resumo</span></button><button class="bottom-btn" data-nav="settings">⚙<span>Ajustes</span></button></nav>
</div><div class="overlay" id="modal"><div class="sheet" id="sheet"></div></div><script src="app.js"></script></body></html>
