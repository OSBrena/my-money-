<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
<title>My Money</title>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <div class="eyebrow">MY MONEY</div>
      <h1 id="pageTitle">Carteira Total</h1>
    </div>
    <button class="icon-btn" id="hideBtn" aria-label="Ocultar saldo">◉</button>
  </header>

  <main>
    <section class="balance-card">
      <div class="label">Saldo disponível</div>
      <div class="balance" id="balance">$ 0,00</div>
      <div class="split" id="split"></div>
    </section>

    <nav class="wallet-tabs">
      <button data-wallet="total" class="active">Total</button>
      <button data-wallet="digital">Digital</button>
      <button data-wallet="cash">Física</button>
    </nav>

    <section class="quick-actions">
      <button data-view="statement">Extrato</button>
      <button data-view="summary">Resumo</button>
    </section>

    <section id="content"></section>
  </main>

  <nav class="bottom">
    <button class="bottom-btn active" data-nav="wallet">⌂<span>Carteira</span></button>
    <button class="bottom-btn" data-nav="statement">▤<span>Extrato</span></button>
    <button class="plus" id="plusBtn">＋</button>
    <button class="bottom-btn" data-nav="goals">◇<span>Metas</span></button>
    <button class="bottom-btn" data-nav="settings">⚙<span>Ajustes</span></button>
  </nav>
</div>

<div class="overlay" id="modal">
  <div class="sheet" id="sheet"></div>
</div>
<script src="app.js"></script>
</body>
</html>
